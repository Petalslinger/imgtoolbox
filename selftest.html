<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图片工具箱 · 自检</title>
<style>
  :root { --ok:#3fbf7f; --bad:#ef5f5f; --dim:#8b93a3; --line:#2c313a; }
  * { box-sizing: border-box; }
  body { margin:0; padding:0 0 40px; background:#14161a; color:#e6e9ef;
         font:13px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  header { position:sticky; top:0; z-index:5; padding:14px 24px;
           background:#1b1e24; border-bottom:1px solid var(--line); }
  h1 { margin:0 0 3px; font-size:16px; }
  .sub { color:var(--dim); font-size:12px; }
  #summary { margin-top:9px; padding:8px 11px; border-radius:6px;
             background:#101216; border:1px solid var(--line);
             font-size:13px; font-weight:600; color:var(--dim); }
  #summary.pass { color:var(--ok); border-color:rgba(63,191,127,.4); }
  #summary.fail { color:var(--bad); border-color:rgba(239,95,95,.4); }
  main { padding:18px 24px 0; max-width:1100px; }
  .group { margin-bottom:16px; border:1px solid var(--line);
           border-radius:8px; overflow:hidden; background:#1b1e24; }
  .group > h2 { margin:0; padding:9px 13px; font-size:12.5px; font-weight:600;
                background:#22262e; border-bottom:1px solid var(--line); }
  ul { margin:0; padding:0; list-style:none; }
  li { display:flex; gap:10px; align-items:baseline;
       padding:6px 13px; border-bottom:1px solid #22262e;
       font-family:ui-monospace,Consolas,"Cascadia Mono",monospace; font-size:12px; }
  li:last-child { border-bottom:0; }
  .mark { flex:0 0 auto; font-weight:700; }
  li.pass .mark { color:var(--ok); }
  li.fail .mark { color:var(--bad); }
  li.fail { background:rgba(239,95,95,.08); }
  .detail { margin-left:auto; text-align:right; color:var(--dim);
            font-family:inherit; font-size:11.5px; max-width:58%; }
  li.fail .detail { color:#f8bcbc; }
  li { flex-wrap: wrap; }
  .hexdump {
    flex: 1 1 100%;
    margin: 6px 0 2px;
    padding: 9px 11px;
    background:#0c0e11;
    border:1px solid var(--line);
    border-radius:5px;
    color:#9fb4d0;
    font-family:ui-monospace,Consolas,monospace;
    font-size:11px;
    line-height:1.45;
    white-space:pre;
    overflow-x:auto;
    cursor:text;
  }
  .hexdump:hover { border-color: var(--dim); }
  .note { margin:14px 0 0; color:var(--dim); font-size:12px; }
  code { font-family:ui-monospace,Consolas,monospace;
         background:#101216; padding:1px 5px; border-radius:3px; }
</style>
</head>
<body>
<header>
  <h1>图片工具箱 · 自检</h1>
  <div class="sub">本页仅用于开发验证，非工具本体。工具入口为 <code>index.html</code>。</div>
  <div id="summary">正在自检…</div>
</header>
<main id="out">
  <p class="note">
    本页加载 <code>js/</code> 下的真实模块（不加载 <code>app.js</code>，
    因其依赖 index.html 的 DOM）。所有断言均直接调用这些模块执行。
  </p>
</main>

<!-- 模块加载顺序与 index.html 一致 -->
<script src="js/util.js"></script>
<script src="js/pdfwriter.js"></script>
<script src="js/zipwriter.js"></script>
<script src="js/state.js"></script>
<script src="js/rename.js"></script>
<script src="js/transform.js"></script>
<script src="js/worker-source.js"></script>
<script src="js/workerhost.js"></script>
<script src="js/pdf.js"></script>
<script src="js/pool.js"></script>
<script src="js/sections.js"></script>
<script src="js/exporter.js"></script>

<script>
(function () {
  'use strict';

  var out = document.getElementById('out');
  var summaryEl = document.getElementById('summary');
  var results = [];
  var files = ['util.js', 'pdfwriter.js', 'zipwriter.js', 'state.js', 'rename.js',
               'transform.js', 'worker-source.js', 'workerhost.js', 'pdf.js',
               'pool.js', 'sections.js', 'exporter.js'];

  /* ── 记录 ─────────────────────────────────────────────── */

  function group(title) {
    var g = document.createElement('section');
    g.className = 'group';
    var h = document.createElement('h2');
    h.textContent = title;
    g.appendChild(h);
    var ul = document.createElement('ul');
    g.appendChild(ul);
    out.appendChild(g);
    return ul;
  }

  function record(ul, ok, name, detail) {
    var li = document.createElement('li');
    li.className = ok ? 'pass' : 'fail';

    var m = document.createElement('span');
    m.className = 'mark';
    m.textContent = ok ? '\u2713' : '\u2717';
    li.appendChild(m);

    var n = document.createElement('span');
    n.textContent = name;
    li.appendChild(n);

    if (detail) {
      var d = document.createElement('span');
      d.className = 'detail';
      d.textContent = detail;
      li.appendChild(d);
    }

    ul.appendChild(li);
    results.push(ok);
  }

  function ok(ul, name, detail) { record(ul, true, name, detail); }
  function bad(ul, name, detail) { record(ul, false, name, detail); }

  function eq(ul, name, actual, expected) {
    if (actual === expected) ok(ul, name, '');
    else bad(ul, name, '得到 ' + JSON.stringify(actual) + '，期望 ' + JSON.stringify(expected));
  }

  function test(ul, name, fn) {
    try {
      var r = fn();
      if (r === true || r === undefined) ok(ul, name, '');
      else if (typeof r === 'string') bad(ul, name, r);
      else ok(ul, name, String(r));
    } catch (e) {
      bad(ul, name, String(e && e.message || e));
    }
  }

  var ITB = window.ITB;
  var U = ITB.util;
  var pending = [];

  /* ── 一、模块加载 ─────────────────────────────────────── */

  var g1 = group('一、模块是否全部加载');
  ['util', 'pdf', 'ZipWriter', 'state', 'rename', 'transform',
   'pdfBuild', 'pool', 'sections', 'exporter', 'workerHost'].forEach(function (n) {
    record(g1, typeof ITB[n] !== 'undefined', 'ITB.' + n,
      typeof ITB[n] === 'undefined' ? '缺失' : '');
  });

  /* ── 二、语法检查（重新取源码编译，不执行） ───────────── */

  var g2 = group('二、每个 js 文件的语法（编译但不执行）');
  var syntaxDone = 0;

  files.forEach(function (f) {
    fetch('js/' + f, { cache: 'no-store' }).then(function (res) {
      return res.text();
    }).then(function (text) {
      try {
        /* eslint-disable no-new-func */
        new Function(text);
        ok(g2, f, text.length + ' 字节');
      } catch (e) {
        bad(g2, f, String(e && e.message || e));
      }
    }).catch(function () {
      /* file:// 下 fetch 会被 CORS 拦截，与工具本身无关 */
      record(g2, true, f, '跳过（file:// 下无法读取文本，改用运行结果判断）');
    }).then(function () {
      syntaxDone++;
      if (syntaxDone === files.length) checkDone();
    });
  });

  /* ── 三、排序与文件名 ─────────────────────────────────── */

  var g3 = group('三、排序与文件名');
  eq(g3, '数字感知：img2 排在 img10 前面',
    ['img10.png', 'img2.png', 'img1.png'].sort(U.naturalCompare).join(','),
    'img1.png,img2.png,img10.png');
  eq(g3, '字典序：img10 排在 img2 前面',
    ['img10.png', 'img2.png'].sort(U.lexCompare).join(','),
    'img10.png,img2.png');
  eq(g3, '拆扩展名', U.splitExt('a.b.png').base, 'a.b');
  eq(g3, '扩展名统一转小写', U.splitExt('a.b.PNG').ext, '.png');
  eq(g3, '没有扩展名', U.splitExt('README').ext, '');
  eq(g3, '隐藏文件整体当主名', U.splitExt('.gitignore').base, '.gitignore');
  eq(g3, '补零', U.pad(7, 3), '007');
  eq(g3, '补零遇到更长的数字不截断', U.pad(12345, 3), '12345');
  eq(g3, '拼回文件名', U.joinName('a', '.png'), 'a.png');
  eq(g3, '字节格式化', U.formatBytes(1536), '1.5 KB');

  /* ── 四、重命名规则引擎 ───────────────────────────────── */

  var g4 = group('四、重命名规则引擎');
  var R = ITB.rename;
  var base = R.defaultParams();

  eq(g4, '未开启任何规则：名字不变', R.applyRules('photo', 0, 3, base), 'photo');

  var pPrefix = R.defaultParams();
  pPrefix.prefixOn = true;
  pPrefix.prefix = 'out_';
  eq(g4, '加前缀', R.applyRules('photo', 0, 3, pPrefix), 'out_photo');

  var pNum = R.defaultParams();
  pNum.numberOn = true;
  pNum.startAt = 1;
  pNum.padTo = 3;
  pNum.numberSep = '_';
  eq(g4, '编号后置 + 补零', R.applyRules('a', 0, 3, pNum), 'a_001');
  eq(g4, '编号按序号递增', R.applyRules('c', 2, 3, pNum), 'c_003');

  var pNumPre = R.defaultParams();
  pNumPre.numberOn = true;
  pNumPre.startAt = 1;
  pNumPre.padTo = 2;
  pNumPre.numberPos = 'prefix';
  pNumPre.numberSep = '-';
  eq(g4, '编号前置', R.applyRules('a', 1, 3, pNumPre), '02-a');

  var pDesc = R.defaultParams();
  pDesc.numberOn = true;
  pDesc.startAt = 1;
  pDesc.padTo = 2;
  pDesc.numberOrder = 'desc';
  pDesc.numberSep = '';
  eq(g4, '升序降序：首张反而是最大号', R.applyRules('a', 0, 3, pDesc), 'a03');

  var pStep = R.defaultParams();
  pStep.numberOn = true;
  pStep.startAt = 10;
  pStep.stepBy = 5;
  pStep.padTo = 3;
  pStep.numberSep = '';
  eq(g4, '起始值 + 步长', R.applyRules('a', 2, 5, pStep), 'a020');

  var pRep = R.defaultParams();
  pRep.replaceOn = true;
  pRep.find = 'IMG';
  pRep.replaceWith = 'pic';
  eq(g4, '字面量替换（忽略大小写）', R.applyRules('img_001', 0, 1, pRep), 'pic_001');

  var pCase = R.defaultParams();
  pCase.replaceOn = true;
  pCase.find = 'IMG';
  pCase.replaceWith = 'pic';
  pCase.caseSensitive = true;
  eq(g4, '区分大小写时不匹配就不替换', R.applyRules('img_001', 0, 1, pCase), 'img_001');

  var pRe = R.defaultParams();
  pRe.replaceOn = true;
  pRe.find = '\\d+';
  pRe.replaceWith = '#';
  pRe.useRegex = true;
  eq(g4, '正则替换（全局）', R.applyRules('a12b34', 0, 1, pRe), 'a#b#');

  var pBad = R.defaultParams();
  pBad.replaceOn = true;
  pBad.find = '(';
  pBad.useRegex = true;
  eq(g4, '正则写错时跳过该步而不是抛异常', R.applyRules('abc', 0, 1, pBad), 'abc');

  eq(g4, '重名检测忽略大小写',
    R.findDuplicates(['a.png', 'b.png', 'A.PNG']).ok, false);
  eq(g4, '不重名时通过',
    R.findDuplicates(['a.png', 'b.png']).ok, true);

  /* ── 五、缩放数学 ─────────────────────────────────────── */

  var g5 = group('五、缩放数学');
  var T = ITB.transform;

  var rw = T.computeTarget(1920, 1080, { mode: 'width', width: 960, allowUpscale: false });
  eq(g5, '按宽度等比，高度自动算', rw.width + 'x' + rw.height, '960x540');

  var rh = T.computeTarget(1920, 1080, { mode: 'height', height: 540, allowUpscale: false });
  eq(g5, '按高度等比，宽度自动算', rh.width + 'x' + rh.height, '960x540');

  var rp = T.computeTarget(1920, 1080, { mode: 'percent', percent: 50, allowUpscale: false });
  eq(g5, '按百分比', rp.width + 'x' + rp.height, '960x540');

  var ru = T.computeTarget(800, 600, { mode: 'width', width: 1920, allowUpscale: false });
  eq(g5, '默认禁止放大，小图保持原样', ru.width + 'x' + ru.height, '800x600');
  eq(g5, '并标记被拦下', ru.blockedByUpscale, true);

  var ru2 = T.computeTarget(800, 600, { mode: 'width', width: 1920, allowUpscale: true });
  eq(g5, '允许放大时才放大', ru2.width + 'x' + ru2.height, '1920x1440');

  var rEq = T.computeTarget(1000, 500, { mode: 'width', width: 1000, allowUpscale: false });
  eq(g5, '目标等于原尺寸时标记为未变化', rEq.unchanged, true);

  eq(g5, '格式对应的扩展名', T.extOf('jpeg'), '.jpg');
  eq(g5, '格式对应的 MIME', T.mimeOf('webp'), 'image/webp');

  /* ── 六、DEFLATE 往返 ─────────────────────────────────── */

  var g6 = group('六、DEFLATE 往返（PDF 的 /FlateDecode 与 ZIP 都依赖它）');

  pending.push(new Promise(function (done) {
    if (typeof CompressionStream !== 'function' || typeof DecompressionStream !== 'function') {
      bad(g6, 'CompressionStream 可用', '当前浏览器不支持，导出 PDF / ZIP 压缩会失败');
      done();
      return;
    }

    var data = new Uint8Array(2000);
    for (var i = 0; i < data.length; i++) data[i] = (i * 37) & 0xff;

    var cs = new CompressionStream('deflate-raw');
    var cw = cs.writable.getWriter();
    cw.write(data);
    cw.close();

    new Response(cs.readable).arrayBuffer().then(function (buf) {
      var comp = new Uint8Array(buf);
      ok(g6, 'deflate-raw 压缩成功', data.length + ' → ' + comp.length + ' 字节');

      var ds = new DecompressionStream('deflate-raw');
      var dw = ds.writable.getWriter();
      dw.write(comp);
      dw.close();
      return new Response(ds.readable).arrayBuffer();
    }).then(function (buf) {
      var back = new Uint8Array(buf);
      var same = back.length === data.length;
      if (same) {
        for (var i = 0; i < back.length; i++) {
          if (back[i] !== data[i]) { same = false; break; }
        }
      }
      record(g6, same, '解压后与原文逐字节一致', same ? '' : '内容不匹配');
      done();
    }).catch(function (e) {
      bad(g6, 'DEFLATE 往返', String(e && e.message || e));
      done();
    });
  }));

  /* ── 七、用 canvas 实际产出的字节验证解析器 ───────────── */

  var g7 = group('七、图片字节解析（输入是真 canvas 编出来的 PNG / JPEG）');

  function canvasToBlob(canvas, mime, q) {
    return new Promise(function (resolve) {
      canvas.toBlob(function (b) { resolve(b); }, mime, q);
    });
  }

  function blobBytes(blob) {
    return blob.arrayBuffer().then(function (b) { return new Uint8Array(b); });
  }

  var testCanvas = document.createElement('canvas');
  testCanvas.width = 64;
  testCanvas.height = 48;
  var testCtx = testCanvas.getContext('2d', { alpha: false });
  testCtx.fillStyle = '#3366cc';
  testCtx.fillRect(0, 0, 64, 48);

  pending.push(canvasToBlob(testCanvas, 'image/png').then(function (pngBlob) {
    return blobBytes(pngBlob).then(function (png) {
      var info = ITB.pdf.parseImage(png);
      record(g7, !!info && info.format === 'png', 'PNG 被识别为 PNG',
        info ? info.format : '识别失败');
      if (info && info.format === 'png') {
        eq(g7, 'PNG 宽度（从 IHDR 读出）', info.width, 64);
        eq(g7, 'PNG 高度（从 IHDR 读出）', info.height, 48);
        eq(g7, 'PNG 色彩空间', info.colorspace, 'DeviceRGB');
        record(g7, info.idat && info.idat.length > 0 && info.idatLength > 0,
          'IDAT 片段被拆出来', info.idatLength + ' 字节');

        var total = 0;
        for (var i = 0; i < info.idat.length; i++) total += info.idat[i].length;
        eq(g7, 'idatLength 与实际片段总长一致', total, info.idatLength);

        /* canvas 产出的 PNG 必然为 8 位、非隔行、无 alpha（已强制 alpha:false） */
        eq(g7, '强制不透明的 canvas 产出无 alpha 的 PNG', info.needsFlatten, false);
      }
      return canvasToBlob(testCanvas, 'image/jpeg', 0.9);
    });
  }).then(function (jpgBlob) {
    return blobBytes(jpgBlob).then(function (jpg) {
      var info = ITB.pdf.parseImage(jpg);
      record(g7, !!info && info.format === 'jpeg', 'JPEG 被识别为 JPEG',
        info ? info.format : '识别失败');
      if (info && info.format === 'jpeg') {
        eq(g7, 'JPEG 宽度（从 SOF 读出）', info.width, 64);
        eq(g7, 'JPEG 高度（从 SOF 读出）', info.height, 48);
        eq(g7, 'JPEG 色彩空间', info.colorspace, 'DeviceRGB');
      }
      eq(g7, '无法识别的字节返回 null 而不是抛异常',
        ITB.pdf.parseImage(new Uint8Array([1, 2, 3])), null);
      eq(g7, '空字节也不抛异常',
        ITB.pdf.parseImage(new Uint8Array(0)), null);
    });
  }).catch(function (e) {
    bad(g7, '解析测试本身出错', String(e && e.message || e));
  }));

  /* ── 八、PDF 结构 ─────────────────────────────────────── */

  var g8 = group('八、PDF 结构（本仓库写出器）');

  var pdfCanvas = document.createElement('canvas');
  pdfCanvas.width = 40;
  pdfCanvas.height = 30;
  var pdfCtx = pdfCanvas.getContext('2d', { alpha: false });
  pdfCtx.fillStyle = '#ff8800';
  pdfCtx.fillRect(0, 0, 40, 30);

  /* pdfBuild.build 的签名为 (items, opts)，items 要求 File/Blob。
     此处仅有 Blob，故封装一层并将结果转为字节。 */
  function buildPdfBytes(entries, opts) {
    var items = entries.map(function (e) {
      return {
        name: e.name,
        file: (typeof File === 'function')
          ? new File([e.blob], e.name, { type: e.blob.type })
          : e.blob
      };
    });
    return ITB.pdfBuild.build(items, opts).then(function (out) {
      return out.blob.arrayBuffer().then(function (buf) {
        return { bytes: new Uint8Array(buf), out: out };
      });
    });
  }

  pending.push(canvasToBlob(pdfCanvas, 'image/png').then(function (blob) {
    return buildPdfBytes([{ name: 'p1.png', blob: blob }], { title: 'selftest' })
      .then(function (res) {
        var pdf = res.bytes;
        var outResult = res.out;
        var text = '';
        for (var i = 0; i < pdf.length; i++) text += String.fromCharCode(pdf[i]);

        eq(g8, '文件头是 %PDF-', text.slice(0, 5), '%PDF-');
        eq(g8, '文件头第 6 字节起是版本号', text.slice(5, 9), '1.4\n');
        eq(g8, '紧接着是二进制标记行', pdf[9], 0xE2);
        record(g8, text.indexOf('%%EOF') > 0, '有 %%EOF 结束标记', '');
        record(g8, text.indexOf('/Type /Catalog') > 0, '有文档目录', '');
        record(g8, text.indexOf('/Type /Pages') > 0, '有页面树', '');
        record(g8, text.indexOf('/Filter /FlateDecode') > 0, 'PNG 页用了 FlateDecode', '');
        record(g8, text.indexOf('/ColorSpace /DeviceRGB') > 0, '色彩空间写对了', '');
        record(g8, text.indexOf('/MediaBox [0 0 40 30]') > 0,
          '页面尺寸等于图片像素（1px = 1pt）', '');

        /* startxref 必须精确指向 xref 表开头 */
        var sx = text.lastIndexOf('startxref');
        var numMatch = /startxref\s+(\d+)/.exec(text.slice(sx));
        var claimed = numMatch ? parseInt(numMatch[1], 10) : -1;
        var xrefAt = text.indexOf('xref\n0 ');
        eq(g8, 'startxref 指向的偏移刚好是 xref 表开头', claimed, xrefAt);

        /* 每个对象的偏移须严格递增，且精确落在「N 0 obj」上 */
        var countMatch = /xref\n0 (\d+)\n/.exec(text);
        var count = countMatch ? parseInt(countMatch[1], 10) : 0;
        record(g8, count > 0, 'xref 声明了对象数', '共 ' + count + ' 个');

        if (count > 0 && claimed === xrefAt) {
          var rows = text.slice(xrefAt).split('\n');
          var allGood = true;
          var prev = -1;
          var checked = 0;

          for (var r = 2; r < 2 + count - 1 && r < rows.length; r++) {
            var off = parseInt(rows[r].slice(0, 10), 10);
            if (!(off > prev)) { allGood = false; break; }
            prev = off;

            var expect = String(r - 1) + ' 0 obj';
            if (text.substr(off, expect.length) !== expect) { allGood = false; break; }
            checked++;
          }

          record(g8, allGood && checked === count - 1,
            '每个 xref 偏移都精确指向对应对象',
            allGood ? '逐个核对 ' + checked + ' 个' : '偏移对不上');
        }

        /* 元数据：ASCII 使用字面量，非 ASCII 使用 UTF-16BE 十六进制串，
           否则 latin1Bytes 会将每个字符替换为 '?'。 */
        record(g8, text.indexOf('/Producer (imgtoolbox)') > 0,
          'ASCII 元数据用字面量字符串', '');

        return buildPdfBytes([{ name: 'p1.png', blob: blob }], { title: '中文标题' });
      }).then(function (res) {
        var pdf = res.bytes;
        var text = '';
        for (var i = 0; i < pdf.length; i++) text += String.fromCharCode(pdf[i]);

        // '中文标题' 的 UTF-16BE 编码为 4E2D 6587 6807 9898，前置 FEFF BOM
        var expectHex = '<FEFF4E2D658768079898>';
        record(g8, text.indexOf('/Title ' + expectHex) > 0,
          '中文标题写成 UTF-16BE 十六进制串（不乱码）',

  /* ── 八之二、严格 PDF 校验器 ──────────────────────────────
     不依赖关键字匹配，而是按解析器顺序完整遍历文件：
     解析 xref 表、逐字节核对对象偏移、校验 stream 与 endstream 之间的
     /Length 声明是否与实际字节数吻合。

    var problems = [];

    /* 2. %%EOF 必须在最末尾附近 */

    if (eofAt < 0) problems.push('缺少 %%EOF');
    else if (text.length - (eofAt + 5) > 6) {
      problems.push('%%EOF 之后还有 ' + (text.length - eofAt - 5) + ' 字节多余内容');
    }

    /* 3. startxref 的值 */
    var sxAt = text.lastIndexOf('startxref');
    if (sxAt < 0) { problems.push('缺少 startxref'); return { problems: problems }; }

    var m = /startxref\s+(\d+)/.exec(text.slice(sxAt));
    if (!m) { problems.push('startxref 后面不是合法数字'); return { problems: problems }; }

    var xrefOffset = parseInt(m[1], 10);
    if (text.substr(xrefOffset, 4) !== 'xref') {
      problems.push('startxref 指向的偏移 ' + xrefOffset + ' 处不是 "xref"（实际是 "' +
        text.substr(xrefOffset, 8).replace(/[^\x20-\x7e]/g, '?') + '"）');
      return { problems: problems };
    }

    /* 4. 逐字段解析 xref 表（不依赖正则匹配） */
    var p = xrefOffset + 4;                       // 跳过 "xref"
    while (text[p] === '\r' || text[p] === '\n' || text[p] === ' ') p++;

    var sub = /^(\d+)\s+(\d+)/.exec(text.slice(p));
    if (!sub) { problems.push('xref 子段头解析失败'); return { problems: problems }; }

    var firstObj = parseInt(sub[1], 10);
    var objCount = parseInt(sub[2], 10);
    p += sub[0].length;
    if (text[p] === '\r') p++;
    if (text[p] === '\n') p++;

    if (firstObj !== 0) problems.push('xref 首个对象号不是 0，而是 ' + firstObj);

    var offsets = {};
    for (var k = 0; k < objCount; k++) {
      var entry = text.substr(p, 20);
      if (entry.length < 20) { problems.push('第 ' + k + ' 条 xref 条目不足 20 字节'); break; }

      /* 每条 20 字节：10 位偏移 + 空格 + 5 位世代号 + 空格 +
         1 位类型 + \r\n。类型位于 [17]，行尾两字节位于 [18][19]；
         行尾必须为 \r\n，否则与 20 字节步进不符。 */
      if (!/^\d{10} \d{5} [nf]\r\n$/.test(entry)) {
        problems.push('第 ' + k + ' 条 xref 条目格式不对：' + JSON.stringify(entry));
      }

      offsets[firstObj + k] = {
        off: parseInt(entry.slice(0, 10), 10),
        type: entry.charAt(17)
      };
      p += 20;
    }

    // 逐个核对：每个 in-use 对象的偏移须精确落在「N 0 obj」上
    var objIds = Object.keys(offsets);
    for (var q = 0; q < objIds.length; q++) {
      var id = objIds[q];
      var rec = offsets[id];
      if (id === '0') continue;
      var expect = id + ' 0 obj';
      var actual = text.substr(rec.off, expect.length);
      if (actual !== expect) {
        problems.push('对象 ' + id + ' 的 xref 偏移 ' + rec.off +
          ' 处实际是 ' + JSON.stringify(actual) + '，应为 ' + JSON.stringify(expect));
      }
    }

    /* 5. trailer */
    var trAt = text.indexOf('trailer', p - 20 > 0 ? p - 20 : 0);
    if (trAt < 0 || trAt > p + 200) problems.push('xref 表之后没有紧跟 trailer');
    else {
      var trText = text.slice(trAt, trAt + 400);
      var sizeM = /\/Size\s+(\d+)/.exec(trText);
      if (!sizeM) problems.push('trailer 里缺少 /Size');
      else if (parseInt(sizeM[1], 10) !== objCount) {
        problems.push('trailer 的 /Size=' + sizeM[1] + ' 与 xref 声明的对象数 ' + objCount + ' 不一致');
      }
      if (!/\/Root\s+\d+\s+\d+\s+R/.test(trText)) problems.push('trailer 里缺少 /Root');
    }

    /* 5. 字典中不得出现 undefined / NaN / null 字面量。
          此类字面量一旦写入 PDF，阅读器将无法打开，且不易察觉。 */
    var badLit = /\/(Length|Width|Height|Size|Count|BitsPerComponent)\s+(undefined|NaN|null)\b/g;
    var bl;
    while ((bl = badLit.exec(text)) !== null) {
      var lineNo = text.slice(0, bl.index).split('\n').length;
      problems.push('第 ' + lineNo + ' 行出现非法值：' + JSON.stringify(bl[0]));
    }

    /* 6. 每个 stream：以 /Length 定位数据末尾，再校验其后紧随 endstream。

    while ((sm = re.exec(text)) !== null) {

      var dataStart = re.lastIndex;              // sm[2] 为 stream 后的换行
      var lenM = /\/Length\s+(\d+)/.exec(dict);

      if (!lenM) {
        problems.push('偏移 ' + dictStart + ' 的 stream 字典里没有 /Length');
        continue;
      }

      var declared = parseInt(lenM[1], 10);
      var after = dataStart + declared;

      if (after > text.length) {
        problems.push('偏移 ' + dictStart + ' 的 stream 声明 /Length=' + declared +
          '，但文件只剩 ' + (text.length - dataStart) + ' 字节');
        continue;
      }

      // /Length 之后允许空白，但随后必须是 endstream
      var tail = text.slice(after, after + 12);
      if (!/^\s*endstream/.test(tail)) {
        problems.push('偏移 ' + dictStart + ' 的 stream 在 /Length 指定的位置（' + after +
          '）之后不是 endstream，而是 ' +
          JSON.stringify(tail.slice(0, 12).replace(/[^\x20-\x7e]/g, '?')));
      }

      var fM = /\/Filter\s+\/(\w+)/.exec(dict);
      streams.push({

        dict: dict,

        length: declared

      imgDicts.push(ctx);
    }

    return {
      problems: problems,
      xrefOffset: xrefOffset,
      objCount: objCount,
      objectOffsets: offsets,
      streams: streams,
      imageCount: imgDicts.length,
      imageContexts: imgDicts
    };
  }

          var pdf = res.bytes;
          eq(g10, '成功产出 1 页', res.out.pages, 1);
          record(g10, pdf.length > 0, '非空 PDF', ITB.util.formatBytes(pdf.length));

          var text = '';
          for (var i = 0; i < pdf.length; i++) text += String.fromCharCode(pdf[i]);

          record(g10, text.indexOf('/MediaBox [0 0 50 40]') > 0,
            '页面尺寸正确 50x40', '');

          /* 当前统一重编码为基线 JPEG 内嵌，透明区在 JPEG 编码前已填充为白色 */
          record(g10, text.indexOf('/Filter /DCTDecode') > 0,
            '图片以 DCTDecode（基线 JPEG）内嵌', '');

          var report = pdfLint(pdf);
          record(g10, report.problems.length === 0, '带 alpha 的图产出的 PDF 结构合法',
            report.problems.length ? report.problems.slice(0, 2).join(' / ') : '无问题');

          /* 关键：填充白底后不应再带 alpha。JPEG 本身无 alpha 通道，
             但色彩空间若写为 DeviceGray 会丢失颜色。 */
          var m = /\/ColorSpace \/(\w+)/.exec(text);
          eq(g10, '色彩空间是 DeviceRGB', m ? m[1] : '(没找到)', 'DeviceRGB');
        });
    });
  }).catch(function (e) {
    bad(g10, '带 alpha 的 PNG 走通 PDF', String(e && e.message || e));
  }));

  /* ── 十一、端到端：改分辨率分区 + 导出 PDF 分区 ─────────── */

  var g11 = group('十一、端到端（改分辨率导 ZIP / 导出 PDF 两条独立出口）');

  var e2eCanvas = document.createElement('canvas');
  e2eCanvas.width = 400;
  e2eCanvas.height = 300;
  var e2eCtx = e2eCanvas.getContext('2d', { alpha: false });
  e2eCtx.fillStyle = '#22aa66';
  e2eCtx.fillRect(0, 0, 400, 300);

  pending.push(canvasToBlob(e2eCanvas, 'image/png').then(function (blob) {
    var f = new File([blob], 'sample.png', { type: 'image/png' });
    var fileItem = {
      id: 1, file: f, name: 'sample.png', relPath: '', size: f.size,
      type: 'image/png', width: 400, height: 300, measured: true, selected: true
    };

    /* 仅检测 hasWorker() 不足以说明 Worker 路径可用：此前该处直接记一条
       pass，而注入清单遗漏辅助函数、每次运行均静默退回主线程，自检仍为通过。
       此处实际组装一次注入源码，组装失败即表明 Worker 路径不可用。 */
    var hasWorker = ITB.workerHost.hasWorker();
    try {
      var injectSrc = ITB.workerHost.buildInjectSource();
      record(g11, typeof injectSrc === 'string' && injectSrc.length > 0,
        'Worker 注入源码可组装（静态依赖检查通过）',
        (hasWorker ? '环境支持 Worker' : '环境不支持 Worker，将退回主线程') +
        ' · 注入 ' + injectSrc.length + ' 字节');
    } catch (e) {
      bad(g11, 'Worker 注入源码无法组装（像素处理将退回主线程）',
        String(e && e.message || e));
    }

    /* 将该图直接写入文件池与 state，再调用真实的分区导出函数，
       而非绕过 exporter 自行拼装参数，以保证覆盖界面实际执行的路径 */
    ITB.state.files = [fileItem];
    ITB.state.sampleId = 1;
    ITB.state.cancelRequested = false;

    var noCancel = function () { return false; };

    /* ── 改分辨率分区：400 → 200 宽，等比得到 200×150 ── */
    return ITB.exporter.runResizeToZip(null, noCancel).then(function (zres) {
      record(g11, !zres.cancelled, '改分辨率分区：没有被取消', '');
      eq(g11, '改分辨率分区：ZIP 里有 1 个条目', zres.entries, 1);
      record(g11, zres.bytes > 0, '改分辨率分区：产出了非空 ZIP',
        U.formatBytes(zres.bytes));

      /* ZIP 条目名应保持原名（该分区不改名），且内容编码也不得改变。
         此处为回归断言：曾出现 mime 未传递，导致缩放后的 JPEG 被编码为
         PNG，而条目名仍为 .jpg。 */
      return zres.blob.arrayBuffer().then(function (zb) {
        var z = new Uint8Array(zb);
        var text = '';
        for (var i = 0; i < Math.min(z.length, 200); i++) text += String.fromCharCode(z[i]);
        record(g11, text.indexOf('sample.png') > 0,
          '改分辨率分区：ZIP 条目名保持原名 sample.png', '');

        /* 条目数据紧接本地文件头与条目名之后。源图为 canvas 产出的 PNG，
           故条目内容应以 PNG 签名开头。 */
        var dataAt = 30 + 'sample.png'.length;
        var isPngData = z[dataAt] === 0x89 && z[dataAt + 1] === 0x50 &&
                        z[dataAt + 2] === 0x4E && z[dataAt + 3] === 0x47;
        record(g11, isPngData,
          '改分辨率分区：条目内容仍为 PNG（编码未改变）',
          isPngData ? '' : '开头字节 ' + z[dataAt] + ' ' + z[dataAt + 1] +
            ' ' + z[dataAt + 2] + ' ' + z[dataAt + 3]);
      });
    }).then(function () {
      /* ── 导出 PDF 分区：应使用原图尺寸 400×300，不受缩放分区影响 ── */
      return ITB.exporter.runPdf(null, noCancel);
    }).then(function (pres) {
      eq(g11, '导出 PDF 分区：页数', pres.pages, 1);
      record(g11, pres.bytes > 0, '导出 PDF 分区：产出了非空 PDF', U.formatBytes(pres.bytes));

      return pres.blob.arrayBuffer().then(function (buf) {
        var z = new Uint8Array(buf);
        var head = String.fromCharCode(z[0], z[1], z[2], z[3], z[4]);
        eq(g11, '导出 PDF 分区：文件头正确', head, '%PDF-');

        var text = '';
        for (var i = 0; i < z.length; i++) text += String.fromCharCode(z[i]);

        /* 分区之间互不影响：PDF 使用原图尺寸，而非缩放后的 200×150 */
        record(g11, text.indexOf('/MediaBox [0 0 400 300]') > 0,
          '导出 PDF 分区：用的是原图尺寸 400×300（不受改分辨率影响）',
          text.indexOf('/MediaBox [0 0 400 300]') > 0 ? '' : '页面尺寸不是 400×300');

        var report = pdfLint(z);
        record(g11, report.problems.length === 0, '导出 PDF 分区：产出的 PDF 结构合法',
          report.problems.length ? report.problems.slice(0, 2).join(' / ') : '无问题');
      });
    });
  }).catch(function (e) {
    bad(g11, '端到端执行', String(e && e.message || e));
  }));

  /* ── 十二、统一页面宽度（须保持宽高比） ───────────────────
     取两张宽度不同的图：400×300 与 200×400。
     统一宽度取最宽者 400，故窄图放大至宽度 400；高度按同一比例计算，
     即 400 × (400/200) = 800。若实现对宽高采用不同比例，则可由此检出变形。
     ──────────────────────────────────────────────────────── */

  var g12 = group('十二、统一页面宽度：按最宽图等比缩放');

  function sizeCanvas(w, h, color) {
    var c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    var cx = c.getContext('2d', { alpha: false });
    cx.fillStyle = color;
    cx.fillRect(0, 0, w, h);
    return c;
  }

  var prevFiles = ITB.state.files;
  var prevSample = ITB.state.sampleId;

  pending.push((function () {
    var wideC = sizeCanvas(400, 300, '#3355aa');
    var narrowC = sizeCanvas(200, 400, '#aa5533');
    var wideBlob = null;
    var narrowBlob = null;

    function asItem(blob, name, id, w, h) {
      var f = new File([blob], name, { type: 'image/png' });
      return {
        id: id, file: f, name: name, relPath: '', size: f.size,
        type: 'image/png', width: w, height: h, measured: true, selected: true
      };
    }

    return canvasToBlob(wideC, 'image/png')
      .then(function (b) { wideBlob = b; return canvasToBlob(narrowC, 'image/png'); })
      .then(function (b) { narrowBlob = b; })
      .then(function () {
        // 排列顺序：宽图在前，窄图在后
        ITB.state.files = [
          asItem(wideBlob, 'wide.png', 9001, 400, 300),
          asItem(narrowBlob, 'narrow.png', 9002, 200, 400)
        ];
        ITB.state.sampleId = 9001;
        ITB.state.cancelRequested = false;

        // 直接调用 pdfBuild，以便显式指定 uniformWidth
        return ITB.pdfBuild.measureMaxWidth(ITB.state.files).then(function (mw) {
          eq(g12, '量出的统一宽度为最宽图的 400', mw, 400);

          return ITB.pdfBuild.build(
            ITB.state.files.map(function (f) { return { name: f.name, file: f.file }; }),
            { title: 'uniform', uniformWidth: true, isCancelled: function () { return false; } }
          );
        });
      })
      .then(function (out) {
        eq(g12, '页数', out.pages, 2);

        return out.blob.arrayBuffer().then(function (buf) {
          var z = new Uint8Array(buf);
          var text = '';
          for (var i = 0; i < z.length; i++) text += String.fromCharCode(z[i]);

          var boxes = [];
          var re = /\/MediaBox \[0 0 (\d+) (\d+)\]/g;
          var m;
          while ((m = re.exec(text)) !== null) {
            boxes.push({ w: parseInt(m[1], 10), h: parseInt(m[2], 10) });
          }

          eq(g12, '两页的 MediaBox 均已写出', boxes.length, 2);

          if (boxes.length === 2) {
            eq(g12, '宽图保持原尺寸 400×300（其为最宽图）',
              boxes[0].w + 'x' + boxes[0].h, '400x300');
            eq(g12, '窄图等比放大至同一宽度 400×800',
              boxes[1].w + 'x' + boxes[1].h, '400x800');
            eq(g12, '两页宽度一致', boxes[0].w === boxes[1].w, true);

            /* 关键断言：宽高比须与原图一致。
               两侧均为整数比，容差取 1e-9 足够。 */
            var before = 200 / 400;
            var after = boxes[1].w / boxes[1].h;
            eq(g12, '窄图宽高比未变形', Math.abs(before - after) < 1e-9, true);
          }

          var report = pdfLint(z);
          record(g12, report.problems.length === 0, '统一宽度后 PDF 结构合法',
            report.problems.length ? report.problems.slice(0, 2).join(' / ') : '无问题');
        });
      })
      .then(function () {
        // 关闭统一宽度：各页应保持原尺寸
        return ITB.pdfBuild.build(
          ITB.state.files.map(function (f) { return { name: f.name, file: f.file }; }),
          { title: 'asis', uniformWidth: false, isCancelled: function () { return false; } }
        );
      })
      .then(function (out) {
        return out.blob.arrayBuffer().then(function (buf) {
          var z = new Uint8Array(buf);
          var text = '';
          for (var i = 0; i < z.length; i++) text += String.fromCharCode(z[i]);

          record(g12, text.indexOf('/MediaBox [0 0 400 300]') > 0 &&
                        text.indexOf('/MediaBox [0 0 200 400]') > 0,
            '关闭统一宽度后各页保持原图尺寸',
            text.indexOf('/MediaBox [0 0 200 400]') > 0 ? '' : '窄图未还原为 200×400');
        });
      })
      .catch(function (e) {
        bad(g12, '统一宽度执行', String(e && e.message || e));
      })
      .then(function () {
        // 恢复初始状态，避免影响后续统计
        ITB.state.files = prevFiles;
        ITB.state.sampleId = prevSample;
      });
  })());

  /* ── 收尾 ─────────────────────────────────────────────── */

  var runtimeDone = false;

  Promise.all(pending).then(function () {
    runtimeDone = true;
    checkDone();
  }).catch(function () {
    runtimeDone = true;
    checkDone();
  });

  function checkDone() {
    if (!runtimeDone || syntaxDone !== files.length) return;

    var pass = 0;
    var fail = 0;
    for (var i = 0; i < results.length; i++) {
      if (results[i]) pass++; else fail++;
    }

    if (fail === 0) {
      summaryEl.className = 'pass';
      summaryEl.textContent = '全部通过：' + pass + ' 项';
    } else {
      summaryEl.className = 'fail';
      summaryEl.textContent = fail + ' 项失败 / 共 ' + (pass + fail) + ' 项（失败的已标红）';
    }
  }

})();
</script>
</body>
</html>
